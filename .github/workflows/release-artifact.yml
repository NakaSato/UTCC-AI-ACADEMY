name: Release Artifact

# This workflow runs only after the independent CI workflow succeeds on main.
# It builds once, publishes the same image to GHCR, records evidence, and never
# deploys. Production promotion is a separate manually approved workflow.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  artifact:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      IMAGE_NAME: ghcr.io/nakasato/utcc-ai-academy
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the green CI revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ env.COMMIT_SHA }}
            ${{ env.IMAGE_NAME }}:v0.0.0-${{ env.COMMIT_SHA }}
            ${{ env.IMAGE_NAME }}:release
          labels: |
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.version=sha-${{ env.COMMIT_SHA }}
            org.opencontainers.image.vendor=UTCC AI Academy

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:sha-${{ env.COMMIT_SHA }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-sha-${{ env.COMMIT_SHA }}.cdx.json

      - name: Scan the published image for Critical vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ env.COMMIT_SHA }}
          format: json
          output: trivy.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign the immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Record build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write the release manifest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: >
          script/release-manifest
          --image "${IMAGE_NAME}"
          --digest "${IMAGE_DIGEST}"
          --commit "${COMMIT_SHA}"
          --spec SPEC-0022
          --environment production
          --sbom sbom.cdx.json
          --vulnerability-scan trivy.json
          --signature cosign
          --provenance github-actions-attestation
          --output release-manifest.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ env.COMMIT_SHA }}
          if-no-files-found: error
          path: |
            sbom.cdx.json
            trivy.json
            release-manifest.json

name: CI

# The same steps as bin/ci, run somewhere other than a laptop. Keep the two in
# step: config/ci.rb is what a developer runs before committing, and this is the
# only authority that can say a commit on main is green. A step added to one
# belongs in the other.
#
# bin/setup has no equivalent here on purpose — it installs gems (ruby/setup-ruby
# does that), prepares the *development* database (a runner has none) and clears
# logs (a runner has none of those either). What it does do locally that matters
# here is start the Postgres in compose.yml; on a runner that is the service
# container declared on the two jobs that touch a database, and the DB_* env
# there is the same set config/database.yml reads.

# Kept in one place so the service container and the env that connects to it
# cannot drift apart. The port is 5432 rather than the 5433 compose.yml uses —
# a runner has no other Postgres to collide with.
env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: utcc
  DB_PASSWORD: utcc

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate backlog and lifecycle documents
        run: bin/docs

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: utcc
          POSTGRES_PASSWORD: utcc
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # db:test:prepare runs the moment the step starts, and a Postgres that is
        # listening is not yet one that is ready. Without this the first job step
        # races the server's initdb.
        options: >-
          --health-cmd "pg_isready -U utcc -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test

      # db/seeds.rb must stay runnable against a fresh test database — the
      # taxonomy in it is one of three copies that have to agree, and nothing
      # else in the suite would notice it breaking.
      - name: Replant the seeds
        env:
          RAILS_ENV: test
        run: bin/rails db:seed:replant

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: utcc
          POSTGRES_PASSWORD: utcc
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utcc -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # test/application_system_test_case.rb registers a headless Edge driver by
      # hand, because Rails' shorthand knows only Chrome and Firefox. Fail here
      # with something readable rather than inside Selenium.
      - name: Verify Microsoft Edge is present
        run: |
          edge="$(command -v microsoft-edge || command -v microsoft-edge-stable || true)"
          if [ -z "$edge" ]; then
            echo "::error::Microsoft Edge is not on this runner. test/application_system_test_case.rb drives headless Edge; either install it here or switch the two :edge references there to a browser the runner has."
            exit 1
          fi
          "$edge" --version

      - name: Run System Tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Mirror human-owned lifecycle transitions only after every independent gate
  # passes on main. Detection and delivery are both non-blocking because Slack
  # is an engagement surface, not the record or a release gate. The script reads
  # repository history only; it never accepts commands or infers decisions from
  # Slack content.
  notify_status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [ docs, scan_ruby, scan_js, lint, test, system-test ]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docs.result == 'success' &&
      needs.scan_ruby.result == 'success' &&
      needs.scan_js.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.system-test.result == 'success'

    steps:
      - name: Checkout status history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - name: Detect validated lifecycle status transitions
        id: transitions
        continue-on-error: true
        run: >-
          ruby script/slack-status-update
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
          --channel "${{ vars.SLACK_STATUS_CHANNEL }}"
          --repository-url "${{ github.server_url }}/${{ github.repository }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Warn when status detection fails
        if: steps.transitions.outcome == 'failure'
        run: echo "::warning::Lifecycle status detection failed; Slack status delivery remains non-blocking."

      - name: Post lifecycle status transitions to Slack
        id: post_status
        if: steps.transitions.outcome == 'success' && steps.transitions.outputs.has_updates == 'true' && vars.SLACK_STATUS_CHANNEL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: ${{ steps.transitions.outputs.payload }}

      - name: Warn when Slack status delivery fails
        if: steps.post_status.outcome == 'failure'
        run: echo "::warning::Lifecycle status delivery to Slack failed; repository status remains authoritative."

  # One message for a whole failed run, not one per job — six red jobs must not
  # become six notifications. See docs/slack.md: failure only (success is the
  # default state, not news), main only (a pull request's author is already
  # looking), and no @channel. Skipped silently when the workspace is not
  # configured, so a fork or a repo without the secret still gets a green run.
  notify:
    runs-on: ubuntu-latest
    needs: [ docs, scan_ruby, scan_js, lint, test, system-test ]
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Post the failure to Slack
        if: ${{ vars.SLACK_CI_CHANNEL != '' }}
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ vars.SLACK_CI_CHANNEL }}"
            text: "CI failed on main — ${{ github.event.head_commit.message }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "🔴 CI failed on main"
              - type: section
                text:
                  type: mrkdwn
                  text: "*<${{ github.event.head_commit.url }}|${{ github.event.head_commit.message }}>*\nby ${{ github.event.head_commit.author.name }} · `${{ github.sha }}`"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Documentation:*\n${{ needs.docs.result }}"
                  - type: mrkdwn
                    text: "*Security (Ruby):*\n${{ needs.scan_ruby.result }}"
                  - type: mrkdwn
                    text: "*Security (JS):*\n${{ needs.scan_js.result }}"
                  - type: mrkdwn
                    text: "*Style:*\n${{ needs.lint.result }}"
                  - type: mrkdwn
                    text: "*Tests:*\n${{ needs.test.result }}"
                  - type: mrkdwn
                    text: "*System tests:*\n${{ needs.system-test.result }}"
              - type: actions
                elements:
                  - type: button
                    text:
                      type: plain_text
                      text: "View the run"
                    url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

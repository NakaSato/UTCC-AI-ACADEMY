name: Deploy development dashboard

on:
  push:
    branches: [ main ]
    paths:
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "script/write-build-metadata"
      - ".github/workflows/pages.yml"
  schedule:
    # Rebuild every morning in the academy's local timezone, even when no
    # documentation commit landed overnight.
    - cron: "0 8 * * *"
      timezone: "Asia/Bangkok"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Tailwind CSS
        run: npm ci

      - name: Validate backlog and lifecycle documents
        run: bin/docs

      - name: Prepare documentation source
        run: |
          mkdir -p tmp/pages-source/_data
          cp -R docs/. tmp/pages-source/
          cp docs/backlog.json tmp/pages-source/_data/backlog.json
          ruby script/write-build-metadata tmp/pages-source
          npx tailwindcss \
            -i docs/assets/css/tailwind.css \
            -o tmp/pages-source/assets/css/style.css \
            --minify

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Convert Markdown to HTML with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./tmp/pages-source
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

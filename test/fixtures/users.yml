<% password_digest = BCrypt::Password.create("password") %>

# student_id is the sign-in identifier. email_address is optional — sign-up does
# not collect one — so `two` deliberately has none.
one:
  name: นักศึกษา หนึ่ง
  student_id: "2011071730901"
  email_address: one@example.com
  password_digest: <%= password_digest %>
  faculty: วิศวกรรมศาสตร์
  study_year: 1

two:
  name: นักศึกษา สอง
  student_id: "2011071730902"
  password_digest: <%= password_digest %>

student:
  name: นักศึกษา สาม
  student_id: "2011071730001"
  password_digest: <%= password_digest %>
  faculty: วิศวกรรมศาสตร์
  study_year: 2

# The three above carry no role and so take the column default, "student".
instructor:
  name: อาจารย์ หนึ่ง
  student_id: "2011071730991"
  password_digest: <%= password_digest %>
  role: instructor

admin:
  name: ผู้ดูแล หนึ่ง
  student_id: "2011071730992"
  password_digest: <%= password_digest %>
  role: admin

admin_two:
  name: ผู้ดูแล สอง
  student_id: "2011071730998"
  password_digest: <%= password_digest %>
  role: admin

# The two shapes an admin-created console account comes in: no student ID at
# all, named by a username and an email. The three above predate /console and
# keep their IDs, which is still a valid account — see User#is_identifiable.
console_instructor:
  name: อาจารย์ คอนโซล
  username: console-teacher
  email_address: teacher@utcc.ac.th
  password_digest: <%= password_digest %>
  role: instructor

console_company:
  name: ผู้ประสานงาน บริษัท
  username: console-partner
  email_address: partner@example.co.th
  password_digest: <%= password_digest %>

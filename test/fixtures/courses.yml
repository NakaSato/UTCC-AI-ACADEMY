# The catalog taxonomy. These mirror the rows the CreateCourses migration writes,
# because db:test:prepare loads the schema and a schema carries no data — without
# these every catalog assertion would run against an empty table.
#
# Copy is NOT here. Titles, descriptions and instructor names still come from
# `catalog.courses.<code>` in the locale files, keyed by the code below.

ai1101:

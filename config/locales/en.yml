      AI1101:
        title: "AI Fundamentals"
        desc: "Understand how AI works, from data and machine learning through to running models in a real business."
        instructor: "Asst. Prof. Chanakan"
      AI1102:
        title: "Python for AI"
        desc: "Write Python that is ready for real data — from data structures and pandas to preparing a dataset."
        instructor: "Mr. Thanakrit"
      AI2201:
        title: "Intro to Machine Learning"
        desc: "Train and evaluate regression, classification and clustering models with scikit-learn on Thai business data."
        instructor: "Asst. Prof. Chanakan"
      AI2105:
        title: "Prompt Engineering for Business"
        desc: "Design prompts that hold up in marketing, customer service and document analysis — and measure them properly."
        instructor: "Ms. Pimchanok"
      AI2108:
        title: "Data & Visualization"
        desc: "Tell stories with the right chart: pick chart types, handle messy data and build dashboards."
        instructor: "Mr. Thanakrit"
      AI3301:
        title: "Intro to Neural Networks"
        desc: "From perceptron to CNN: understand backpropagation and train real models in PyTorch."
        instructor: "Assoc. Prof. Athit"
      AI2210:
        title: "Generative AI for Marketing"
        desc: "Use image and text models in campaign work, with the copyright and brand caveats that come with them."
        instructor: "Ms. Pimchanok"
      AI2402:
        title: "AI Ethics and Governance"
        desc: "Bias in data, privacy, PDPA, and how organisations govern their use of AI."
        instructor: "Asst. Prof. Wannida"


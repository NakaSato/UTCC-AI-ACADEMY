  # Kept 1:1 with th.yml, where these do the real work — Rails ships the English
  # wording already, so the values here just restate it.
  policy:
    updated_on: "Last updated %{date}"
    read_other: "Read the %{document} →"

  privacy:
    title: "Privacy notice (PDPA)"
    intro: "What this site records about you, why, and what you can ask us to do with it. Written to meet the Personal Data Protection Act B.E. 2562 (2019)."
    updated_on: "26 July 2026"
    sections:
      who:
        title: "Who is responsible for your data"
        body:
          - "This site is built and run by a group of UTCC upperclassmen as a study aid for juniors taking the AI Fundamental curriculum. It is not an official University of the Thai Chamber of Commerce service, and the university does not operate it."
          - "That means the student group running this site is the data controller under the PDPA — not the university. Questions about your data should come to us, at the contact address at the end of this notice."
      collected:
        title: "What we collect"
        body:
          - "We keep only what the site needs in order to work. There is no profile builder, no advertising profile, and nothing is bought from anyone else."
        items:
          - "Your account: name, student ID, faculty, year of study, and a password stored only as a bcrypt hash — never as text we can read."
          - "Your email address, only if you choose to give one. Sign-up does not ask for it, and most accounts have none."
          - "Sign-in records: the IP address and browser user-agent of each session, and when it started. These exist so you can be signed in, and so we can spot an account being broken into."
          - "Your learning progress: which topic you finished, in which course, and when you learned and applied it."
          - "Your role — student, instructor or admin — which decides which screens you can open."
      purposes:
        title: "Why we use it"
        body:
          - "Each purpose below is the reason a specific piece of the list above exists. We do not use your data for anything else without asking you first."
        items:
          - "To give you an account and keep you signed in."
          - "To show your progress, level, streak and gems, and to place you on the leaderboard."
          - "To let teaching staff see how a class is progressing."
          - "To send you a password reset link, if you asked for one and gave us an email address."
          - "To keep the site secure — rate limiting, and investigating abuse."
      basis:
        title: "Our lawful basis"
        body:
          - "Under the PDPA we rely on the following bases. Where we rely on your consent, you may withdraw it at any time without affecting anything that happened before you did."
        items:
          - "Performance of a contract, for running the account you asked us to create."
          - "Legitimate interest, for security, abuse prevention and keeping the service working."
          - "Your consent, for the optional email address and for anything we add later that is not needed to run the site."
      cookies:
        title: "Cookies"
        body:
          - "We set one cookie. It is called `session_id`, it holds a signed reference to your sign-in record, and it is marked HttpOnly and SameSite=Lax so that scripts cannot read it and other sites cannot use it."
          - "Ticking “remember me on this device” makes that cookie persist; leaving it unticked means the cookie disappears when you close the browser. We also remember your language choice for the length of your visit."
          - "There are no advertising cookies, no analytics cookies, and no third-party trackers on this site."
      sharing:
        title: "Who else sees it"
        body:
          - "We do not sell your data, share it for advertising, or send it to anyone for their own purposes. Three technical exceptions are worth naming plainly:"
        items:
          - "Our hosting provider stores the database and server logs on our behalf."
          - "This site loads its typefaces from Google Fonts. That means your IP address and browser details reach Google every time a page loads. If you would rather that did not happen, a browser extension that blocks third-party fonts will stop it, and the site stays readable."
          - "If you request a password reset, the email provider we use handles that message."
      retention:
        title: "How long we keep it"
        body:
          - "Your account and your learning progress are kept for as long as your account exists. Sign-in records are kept while they are useful for security and then removed."
          - "Ask us to delete your account and we will remove it, along with your progress. Because progress is the point of the site, deleting the account deletes the record of what you finished — we cannot give it back afterwards."
      security:
        title: "How we protect it"
        body:
          - "Passwords are hashed with bcrypt and never stored in a form we can read. Traffic is served over HTTPS. The session cookie is signed and HttpOnly. Staff screens are gated by role, and an administrator cannot change their own role."
          - "We should also be straight with you: this is a student-run teaching project, not a bank. We have taken the precautions we know how to take, and you should not store anything here that you would be harmed by losing. Do not reuse a password you use anywhere important."
      rights:
        title: "Your rights under the PDPA"
        body:
          - "The Act gives you the following rights over your own data. Write to the address below and we will answer within 30 days."
        items:
          - "To be informed about, and to access, the data we hold about you."
          - "To receive a copy of it, and to ask us to send it to someone else."
          - "To correct anything inaccurate or incomplete."
          - "To have it erased, or made anonymous."
          - "To ask us to pause using it while a dispute is resolved."
          - "To object to a particular use of it."
          - "To withdraw consent you previously gave."
      complaints:
        title: "If you are not satisfied"
        body:
          - "Tell us first and we will try to put it right. You also have the right to complain to the Personal Data Protection Committee (PDPC) in Thailand, and you do not need our permission to do so."
      children:
        title: "Students under 20"
        body:
          - "This site is for enrolled UTCC students, who are usually adults. If you are under 20, Thai law may require a parent or guardian to consent on your behalf — please ask them before you create an account."
      changes:
        title: "Changes to this notice"
        body:
          - "If we change what we collect or why, we will update this page and change the date at the top. Where a change needs your consent, we will ask for it rather than assume it."
      contact:
        title: "How to reach us"
        body:
          - "Write to the UTCC upperclassmen community that runs this site. Because this is a student project rather than a company, the fastest route is usually the person who gave you the link, or the contact address published alongside it."
          - "CONTACT DETAILS TO BE FILLED IN before this notice is published — the PDPA requires a working contact point for the data controller."

  terms:
    title: "Terms of use"
    intro: "The rules for using this site. Short version: it is a study aid built by students, use it honestly, and do not mistake it for the university's own systems."
    updated_on: "26 July 2026"
    sections:
      who:
        title: "Who runs this site"
        body:
          - "This is a study aid built and run by UTCC upperclassmen for juniors taking the AI Fundamental curriculum. It is not an official University of the Thai Chamber of Commerce website, and nothing here is an official university record or communication."
      eligibility:
        title: "Who may use it"
        body:
          - "Accounts are for enrolled UTCC students and for the teaching staff who work with them. One account per person, registered with your own student ID."
      account:
        title: "Your account"
        body:
          - "Keep your password to yourself and do not let anyone else use your account. Tell us if you think someone else has got into it."
          - "Do not create an account with someone else's student ID, and do not try to obtain a role — instructor or admin — that has not been given to you."
      acceptable_use:
        title: "Acceptable use"
        body:
          - "Use the site as a place to learn. The following are not allowed:"
        items:
          - "Attacking the site, or trying to reach data that is not yours."
          - "Automated scraping, or hammering the site with requests."
          - "Uploading someone else's personal data, or anything unlawful or abusive."
          - "Passing your account to someone else, or using the site to help another student misrepresent their own work."
      academic:
        title: "Academic honesty"
        body:
          - "This site does not grant credit. Your progress, level and place on the leaderboard are here to help you learn and mean nothing to the registrar."
          - "Each course sets its own rules about using AI in assessed work, and those rules win over anything you read here. When you use AI for coursework, cite it. Using this site is not a defence against an academic misconduct finding."
      grading:
        title: "How grading actually works, and what it is worth"
        body:
          - "You should know how the exercises are marked, because it affects how much the result means. Lesson grading currently runs in your browser, which means the answer key is technically visible to anyone who looks for it, and the site records a pass because your browser reported one."
          - "So your progress here is a record of what you told us you finished, not a proctored assessment, and it should never be presented as one. We are telling you this rather than letting you assume otherwise. Marking students' work properly belongs on the server, and that is where it will move."
      content:
        title: "Course material and your work"
        body:
          - "Course material on this site belongs to whoever wrote it. You may use it to study; do not republish it or sell it."
          - "Anything you write into the site stays yours. By putting it here you allow us to store and display it as part of running the site."
      availability:
        title: "Availability"
        body:
          - "This is run by students in their own time. There is no uptime guarantee, no support desk, and no promise that the site will exist next semester. Features may change or be removed, and we may need to reset data while the site is still being built."
      liability:
        title: "No warranty, and limits on liability"
        body:
          - "The site is provided as it is, with no warranty of any kind. The content is a study aid written by students and may be wrong or out of date."
          - "To the extent Thai law allows, the people running this site are not liable for loss arising from your use of it — including lost work, lost progress, or a grade you did not get. Nothing here limits liability that cannot lawfully be limited."
      termination:
        title: "Suspension"
        body:
          - "We may suspend or remove an account that breaks these terms, particularly where it puts other students' data or the site itself at risk. You can stop using the site and ask us to delete your account whenever you like."
      changes:
        title: "Changes to these terms"
        body:
          - "We may update these terms as the site grows. The date at the top says when we last did. If you keep using the site after a change, you accept the new version."
      contact:
        title: "How to reach us"
        body:
          - "The same contact route as the privacy notice — see the address published alongside the link that brought you here."
          - "CONTACT DETAILS TO BE FILLED IN before these terms are published."


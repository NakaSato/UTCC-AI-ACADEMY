    theory:
      eyebrow: "Theory · 6 min"
      heading: "Supervised vs. Unsupervised Learning"
      p1: "Machine learning splits into two broad families based on the data you feed the model. The difference is whether that data carries labels or not."
      p2: "In practice you always split data into a train set and a test set, so you can tell whether the model truly generalizes rather than memorizes."
      sup_title: "Supervised Learning"
      sup_desc: "Data comes with labels. The model learns from (input → output) pairs, then predicts values it has never seen."
      sup_eg: "e.g. sales forecasting, spam filtering"
      unsup_title: "Unsupervised Learning"
      unsup_desc: "No labels. The model finds hidden structure or groups in the data by itself."
      unsup_eg: "e.g. customer segmentation, dimensionality reduction"
      code_comment: "# 80% train / 20% test"
      to_quiz: "Take the exercise →"
      open_link: "Open link →"
      blocks:
        - "Remember: the test set must never be seen during training, or your results will look better than they are."
        - "n_{train} = \\lceil 0.8\\,N \\rceil, \\quad n_{test} = N - n_{train}"
        - "scores = cross_val_score(model, X, y, cv=5)\nprint(scores.mean(), scores.std())"
        - "scikit-learn docs · train_test_split"

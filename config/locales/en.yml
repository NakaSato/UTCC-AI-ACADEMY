# English is the secondary locale and the fallback for anything th.yml misses.
# Keys are shared 1:1 with th.yml — see that file for the structure.
en:
  language_name: "EN"
  language_full_name: "English"

  # Dates and times are spelled out here rather than inherited from Rails so the
  # two locales stay 1:1 and neither drifts silently. These values match Rails'
  # English defaults exactly — English output is unchanged.
  date:
    formats:
      default: "%Y-%m-%d"
      short: "%b %d"
      long: "%B %d, %Y"
    day_names: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
    abbr_day_names: [Sun, Mon, Tue, Wed, Thu, Fri, Sat]
    month_names: [~, January, February, March, April, May, June, July, August, September, October, November, December]
    abbr_month_names: [~, Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
  time:
    formats:
      default: "%a, %d %b %Y %H:%M:%S %z"
      short: "%d %b %H:%M"
      long: "%B %d, %Y %H:%M"
    am: "am"
    pm: "pm"


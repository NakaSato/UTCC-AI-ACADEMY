          options:
            - "Search a database for one guaranteed answer."
            - "Predict the next token from the current context."
            - "Run a spreadsheet formula for every sentence."
            - "Ask a human to label each output token."
          keys: [ "A", "B", "C", "D" ]
          check: "Check answer"
          to_code: "Try the applied task →"
          correct_title: "Correct · +5 gems"
          correct_body: "Correct — generation repeats next-token prediction using the context so far."
          wrong_title: "Try again · −1 heart"
          wrong_body: "Look for the mechanism that selects one likely continuation at a time from the current context."
        code:
          eyebrow: "Applied task · Python"
          title: "Calculate a token budget"
          task: "Complete the code so the total token budget includes the prompt tokens and the maximum number of new tokens."
          criteria: "Passing criteria"
          run: "Run & check"
          reset: "Reset"
          finish: "Finish topic →"
          editor_label: "Python code for this task"
          starter: |
            total_tokens = ___ + ___
            print(total_tokens)
          checks:
            - "Assign the total token count"
            - "Include prompt_tokens"
            - "Include max_new_tokens"
          console_running: "  running…"
          console_idle: "  ready — press “Run & check”"
          console_pass: "✓ all 3 criteria passed · +10 gems"
          console_fail: "✗ not passing yet — add prompt_tokens and max_new_tokens"
      topic_4_2:
        theory:
          eyebrow: "Topic 4-2 · 10 min"
          heading: "Writing prompts that work"
          p1: "A dependable prompt gives the model a task, the relevant context, and a clear output format. Examples and constraints can reduce ambiguity when the work is important."
          p2: "Prompt quality is a hypothesis to test, not a magic phrase. Try representative inputs, inspect failures, and keep the prompt versioned when it becomes part of a workflow."
          sup_title: "Task and context"
          sup_desc: "Say what the model should do and provide the facts or source text it may use. Do not assume hidden context."
          sup_eg: "Task: summarize · Context: feedback text"
          unsup_title: "Format and constraints"
          unsup_desc: "Specify the shape, length, audience, and boundaries of the response so a useful result is easier to check."
          unsup_eg: "Output format: three bullet points"
          code_comment: "# make the request testable"
          to_quiz: "Check your understanding →"
          open_link: "Read the prompt design guide →"
          blocks:
            - "A prompt should make the desired decision or artifact observable: define what success looks like before tuning wording."
            - "task + context + output format + constraints"
            - "Task: summarize the customer feedback.\nContext: use only the provided feedback.\nOutput format: three bullet points."
            - "OpenAI guide · prompt engineering"
        quiz:
          eyebrow: "Exercise · make a prompt testable"
          question: "Which prompt structure gives a model the clearest starting point for a bounded task?"
          options:
            - "State the task, provide relevant context, and specify the output format."
            - "Say only: ‘Do something useful.’"
            - "Hide the source text and rely on the model to guess it."
            - "Change the request randomly after every response."
          keys: [ "A", "B", "C", "D" ]
          check: "Check answer"
          to_code: "Try the applied task →"
          correct_title: "Correct · +5 gems"
          correct_body: "Correct — task, context, and output format make the request concrete and testable."
          wrong_title: "Try again · −1 heart"
          wrong_body: "Look for the structure that reduces ambiguity and tells the model what evidence and shape to use."
        code:
          eyebrow: "Applied task · Python"
          title: "Write a structured prompt"
          task: "Complete the prompt so it states a task, supplies context, and requires an explicit output format."
          criteria: "Passing criteria"
          run: "Run & check"
          reset: "Reset"
          finish: "Finish topic →"
          editor_label: "Python code for this task"
          starter: |
            prompt = "Task: ___\nContext: ___\nOutput format: ___"
            print(prompt)
          checks:
            - "State a task"
            - "Provide relevant context"
            - "Specify an output format"
          console_running: "  running…"
          console_idle: "  ready — press “Run & check”"
          console_pass: "✓ all 3 criteria passed · +10 gems"
          console_fail: "✗ not passing yet — include task, context, and output format"
      topic_5_1:
        theory:
          eyebrow: "Topic 5-1 · 10 min"
          heading: "Assessing the business case"
          p1: "An AI idea becomes a business case when it names the decision or workflow to improve, the people affected, and a measurable result such as time saved, revenue gained, or errors avoided."
          p2: "Estimate the benefit and the full operating cost, then test feasibility and risk. A small, measurable pilot is usually stronger evidence than a large promise based only on model accuracy."
          sup_title: "Value and measurement"
          sup_desc: "Define a baseline, a target metric, and who benefits. Convert expected improvement into an annual value without counting the same benefit twice."
          sup_eg: "hours saved × cost per hour"
          unsup_title: "Feasibility and risk"
          unsup_desc: "Check data availability, workflow integration, human oversight, privacy, and the cost of wrong outputs before approving a pilot."
          unsup_eg: "valuable + feasible + responsible"
          code_comment: "# compare recurring benefit with recurring cost"
          to_quiz: "Check your understanding →"
          open_link: "Read the AI risk management overview →"
          blocks:
            - "Start with the business outcome, not the model: state what should improve, for whom, and how the change will be measured against today's baseline."
            - "annual net value = annual benefit − annual cost"
            - "annual_net_value = annual_benefit - annual_cost\nprint(annual_net_value)"
            - "NIST · AI Risk Management Framework"
        quiz:
          eyebrow: "Exercise · choose a testable case"
          question: "Which proposal is the strongest starting point for an AI business case?"
          options:
            - "Pilot invoice review to cut average handling time by 20%, with a baseline, cost estimate, and human check for flagged cases."
            - "Buy an AI tool because competitors mention AI in their reports."
            - "Automate every customer decision before checking the available data or failure cost."
            - "Judge success only by whether the model produces impressive demonstrations."
          keys: [ "A", "B", "C", "D" ]
          check: "Check answer"
          to_code: "Try the applied task →"
          correct_title: "Correct · +5 gems"
          correct_body: "Correct — the proposal identifies a workflow, measurable target, costs, and a control for consequential errors."
          wrong_title: "Try again · −1 heart"
          wrong_body: "Look for a bounded proposal with a baseline, measurable outcome, realistic costs, and risk controls."
        code:
          eyebrow: "Applied task · Python"
          title: "Calculate annual net value"
          task: "Complete the calculation so annual net value subtracts the recurring annual cost from the recurring annual benefit."
          criteria: "Passing criteria"
          run: "Run & check"
          reset: "Reset"
          finish: "Finish topic →"
          editor_label: "Python code for this task"
          starter: |
            annual_net_value = ___ - ___
            print(annual_net_value)
          checks:
            - "Assign annual_net_value"
            - "Start with annual_benefit"
            - "Subtract annual_cost"
          console_running: "  running…"
          console_idle: "  ready — press “Run & check”"
          console_pass: "✓ all 3 criteria passed · +10 gems"
          console_fail: "✗ not passing yet — subtract annual_cost from annual_benefit"

      mix: "Theory + code"
      project: "Project"
    modules:
      - title: "Data and AI thinking"
        desc: "Where the data in an AI system comes from, what makes it usable, and the questions to ask before any model is trained."
        topics:
          - "What AI is, and actually does"
          - "Types of data"
          - "Measuring data quality"
      - title: "Machine learning basics"
        desc: "The vocabulary the rest of the course assumes: how a model learns from examples, and how you tell a good one from a bad one."
        topics:
          - "How models learn"
          - "Loss and metrics"
          - "Supervised vs. Unsupervised"
          - "Overfitting and regularization"
      - title: "Your first model with scikit-learn"
        desc: "The whole workflow end to end — load a dataset, split it, fit a model, and read the score you get back."
        topics:
          - "Prepare data with pandas"
          - "Train, evaluate, tune"
      - title: "Generative AI"
        desc: "What a language model is actually doing when it answers, and how to get dependable work out of one."
        topics:
          - "How LLMs work"
          - "Writing prompts that work"
      - title: "Applying AI in business"
        desc: "Choosing problems worth automating, sizing the benefit, and what a Thai business case looks like in practice."
        topics:
          - "Assessing the business case"
          - "Thai business case study"
      - title: "Ethics and PDPA"
        desc: "Where AI systems harm people, and the duties the PDPA places on anyone handling Thai personal data."
        topics:
          - "Bias in data"
          - "Data privacy"


        desc: "ลงมือทำครบทุกขั้น ตั้งแต่โหลดชุดข้อมูล แบ่งข้อมูล ฝึกโมเดล ไปจนถึงอ่านค่าคะแนนที่ได้"
        topics:
          - "เตรียมข้อมูลด้วย pandas"
          - "Train, evaluate, tune"
      - title: "AI เชิงสร้าง (Generative AI)"
        desc: "โมเดลภาษากำลังทำอะไรตอนที่มันตอบ และจะใช้มันให้ได้ผลลัพธ์ที่เชื่อถือได้อย่างไร"
        topics:
          - "LLM ทำงานอย่างไร"
          - "เขียน prompt ให้ได้ผล"
      - title: "นำ AI ไปใช้ในธุรกิจ"
        desc: "เลือกปัญหาที่ควรทำให้เป็นอัตโนมัติ ประเมินผลตอบแทน และดูตัวอย่างเคสธุรกิจไทยของจริง"
        topics:
          - "ประเมินความคุ้มค่า"
          - "กรณีศึกษาธุรกิจไทย"
      - title: "จรรยาบรรณและ PDPA"
        desc: "AI สร้างความเสียหายกับคนได้ตรงไหน และ PDPA กำหนดหน้าที่อะไรไว้กับผู้ดูแลข้อมูลส่วนบุคคลของคนไทย"
        topics:
          - "อคติในข้อมูล"
          - "ความเป็นส่วนตัวของข้อมูล"

    curricula:
      AI1102:
        modules:
          - title: "พื้นฐาน Python"
            desc: "สร้างพื้นฐาน Python ที่ใช้ตรวจสอบข้อมูลและแปลงข้อมูลขนาดเล็กได้อย่างน่าเชื่อถือ"

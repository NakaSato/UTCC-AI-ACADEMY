  privacy:
    title: "นโยบายความเป็นส่วนตัว (PDPA)"
    intro: "เว็บไซต์นี้เก็บข้อมูลอะไรของคุณ เก็บไปทำอะไร และคุณขอให้เราทำอะไรกับข้อมูลนั้นได้ จัดทำตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562"
    updated_on: "26 กรกฎาคม 2569"
    sections:
      who:
        title: "ใครเป็นผู้รับผิดชอบข้อมูลของคุณ"
        body:
          - "เว็บไซต์นี้จัดทำและดูแลโดยกลุ่มรุ่นพี่ของมหาวิทยาลัยหอการค้าไทย เพื่อช่วยรุ่นน้องที่เรียนในหลักสูตร AI Fundamental ไม่ใช่บริการอย่างเป็นทางการของมหาวิทยาลัย และมหาวิทยาลัยไม่ได้เป็นผู้ดำเนินการ"
          - "ดังนั้นผู้ควบคุมข้อมูลส่วนบุคคลตาม PDPA คือกลุ่มนักศึกษาที่ดูแลเว็บไซต์นี้ ไม่ใช่มหาวิทยาลัย หากมีคำถามเกี่ยวกับข้อมูลของคุณ กรุณาติดต่อเราตามช่องทางท้ายนโยบายนี้"
      collected:
        title: "เราเก็บข้อมูลอะไร"
        body:
          - "เราเก็บเท่าที่เว็บไซต์จำเป็นต้องใช้เพื่อทำงานได้ ไม่มีการสร้างโปรไฟล์เพื่อโฆษณา และไม่มีการซื้อข้อมูลจากที่อื่น"
        items:
          - "บัญชีของคุณ: ชื่อ รหัสนักศึกษา คณะ ชั้นปี และรหัสผ่านที่เก็บเป็นค่าแฮช bcrypt เท่านั้น เราไม่ได้เก็บรหัสผ่านในรูปแบบที่อ่านได้"
          - "อีเมลของคุณ เฉพาะกรณีที่คุณเลือกให้ไว้ ขั้นตอนสมัครสมาชิกไม่ได้ถามอีเมล และบัญชีส่วนใหญ่ไม่มีข้อมูลนี้"
          - "บันทึกการเข้าสู่ระบบ: หมายเลขไอพี ข้อมูลเบราว์เซอร์ (user-agent) และเวลาที่เริ่มเข้าใช้งาน ข้อมูลนี้มีไว้เพื่อให้คุณคงสถานะเข้าสู่ระบบได้ และเพื่อให้เราสังเกตได้เมื่อมีคนพยายามเข้าบัญชีของคุณ"
          - "ความก้าวหน้าในการเรียน: คุณเรียนหัวข้อใดจบ ในรายวิชาใด และเรียนรู้กับนำไปใช้เมื่อใด"
          - "สิทธิ์การใช้งานของคุณ — นักศึกษา อาจารย์ หรือผู้ดูแลระบบ — ซึ่งกำหนดว่าคุณเปิดหน้าใดได้"
      purposes:
        title: "เราใช้ข้อมูลไปทำอะไร"
        body:
          - "แต่ละวัตถุประสงค์ด้านล่างคือเหตุผลที่ข้อมูลแต่ละรายการข้างต้นมีอยู่ เราไม่นำข้อมูลของคุณไปใช้เพื่อการอื่นโดยไม่ถามคุณก่อน"
        items:
          - "เพื่อสร้างบัญชีและคงสถานะการเข้าสู่ระบบของคุณ"
          - "เพื่อแสดงความก้าวหน้า ระดับ สตรีค และเพชรของคุณ และจัดอันดับบนกระดานผู้นำ"
          - "เพื่อให้อาจารย์เห็นภาพรวมความก้าวหน้าของชั้นเรียน"
          - "เพื่อส่งลิงก์ตั้งรหัสผ่านใหม่ ในกรณีที่คุณขอและได้ให้อีเมลไว้"
          - "เพื่อรักษาความปลอดภัยของระบบ ทั้งการจำกัดจำนวนครั้งการเรียกใช้ และการตรวจสอบการใช้งานที่ผิดปกติ"
      basis:
        title: "ฐานทางกฎหมายที่เราใช้"
        body:
          - "ตาม PDPA เราอาศัยฐานทางกฎหมายต่อไปนี้ ในส่วนที่อาศัยความยินยอมของคุณ คุณถอนความยินยอมได้ตลอดเวลา โดยไม่กระทบสิ่งที่ดำเนินไปแล้วก่อนการถอน"
        items:
          - "การปฏิบัติตามสัญญา สำหรับการให้บริการบัญชีที่คุณขอให้เราสร้าง"
          - "ประโยชน์อันชอบธรรม สำหรับความปลอดภัย การป้องกันการใช้งานในทางที่ผิด และการดูแลให้ระบบใช้งานได้"
          - "ความยินยอมของคุณ สำหรับอีเมลที่ให้ไว้โดยสมัครใจ และสำหรับสิ่งที่เราอาจเพิ่มในอนาคตซึ่งไม่จำเป็นต่อการให้บริการ"
      cookies:
        title: "คุกกี้"
        body:
          - "เราใช้คุกกี้เพียงตัวเดียว ชื่อ `session_id` เก็บค่าอ้างอิงที่ลงลายมือชื่อกำกับไปยังบันทึกการเข้าสู่ระบบของคุณ และกำหนดเป็น HttpOnly กับ SameSite=Lax เพื่อให้สคริปต์อ่านไม่ได้ และเว็บไซต์อื่นนำไปใช้ไม่ได้"
          - "หากเลือก “จดจำฉันไว้ในเครื่องนี้” คุกกี้จะอยู่ต่อ หากไม่เลือก คุกกี้จะหายไปเมื่อคุณปิดเบราว์เซอร์ นอกจากนี้เราจำภาษาที่คุณเลือกไว้ตลอดการใช้งานครั้งนั้น"
          - "เว็บไซต์นี้ไม่มีคุกกี้โฆษณา ไม่มีคุกกี้วิเคราะห์พฤติกรรม และไม่มีตัวติดตามของบุคคลที่สาม"
      sharing:
        title: "ใครเห็นข้อมูลของคุณอีก"
        body:
          - "เราไม่ขายข้อมูลของคุณ ไม่แบ่งปันเพื่อการโฆษณา และไม่ส่งให้ผู้อื่นไปใช้ตามวัตถุประสงค์ของเขา มีข้อยกเว้นทางเทคนิคสามข้อที่ควรบอกกันตรง ๆ"
        items:
          - "ผู้ให้บริการโฮสติงของเราเก็บฐานข้อมูลและบันทึกการทำงานของเซิร์ฟเวอร์ไว้ในฐานะผู้ประมวลผลข้อมูลแทนเรา"
          - "เว็บไซต์นี้เรียกใช้ฟอนต์จาก Google Fonts ซึ่งทำให้หมายเลขไอพีและข้อมูลเบราว์เซอร์ของคุณไปถึง Google ทุกครั้งที่เปิดหน้าเว็บ หากไม่ต้องการ ส่วนขยายเบราว์เซอร์ที่บล็อกฟอนต์ของบุคคลที่สามจะหยุดการส่งข้อมูลนี้ได้ และเว็บไซต์ยังอ่านได้ปกติ"
          - "หากคุณขอตั้งรหัสผ่านใหม่ ผู้ให้บริการอีเมลที่เราใช้จะเป็นผู้ส่งข้อความนั้น"
      retention:
        title: "เราเก็บข้อมูลไว้นานเท่าใด"
        body:
          - "บัญชีและความก้าวหน้าในการเรียนของคุณจะถูกเก็บไว้ตลอดเวลาที่บัญชียังอยู่ บันทึกการเข้าสู่ระบบจะถูกเก็บเท่าที่ยังเป็นประโยชน์ต่อความปลอดภัย แล้วจึงลบออก"
          - "หากคุณแจ้งให้ลบบัญชี เราจะลบบัญชีพร้อมความก้าวหน้าของคุณ เนื่องจากความก้าวหน้าคือหัวใจของเว็บไซต์นี้ การลบบัญชีจึงหมายถึงการลบบันทึกสิ่งที่คุณเรียนจบไปด้วย และเราไม่สามารถกู้คืนให้ได้ในภายหลัง"
      security:
        title: "เราดูแลข้อมูลอย่างไร"
        body:
          - "รหัสผ่านถูกแฮชด้วย bcrypt และไม่เคยถูกเก็บในรูปแบบที่เราอ่านได้ การรับส่งข้อมูลใช้ HTTPS คุกกี้เซสชันมีลายมือชื่อกำกับและเป็น HttpOnly หน้าสำหรับอาจารย์และเจ้าหน้าที่ถูกกั้นด้วยสิทธิ์การใช้งาน และผู้ดูแลระบบเปลี่ยนสิทธิ์ของตนเองไม่ได้"
          - "และขอบอกกันตรง ๆ ว่านี่เป็นโปรเจกต์เพื่อการเรียนการสอนที่นักศึกษาดูแลกันเอง ไม่ใช่ระบบของธนาคาร เราป้องกันเท่าที่เรารู้วิธี คุณจึงไม่ควรเก็บสิ่งที่จะเสียหายหากสูญหายไว้ที่นี่ และไม่ควรใช้รหัสผ่านซ้ำกับบัญชีสำคัญอื่น"
      rights:
        title: "สิทธิของคุณตาม PDPA"
        body:
          - "กฎหมายให้สิทธิต่อไปนี้แก่คุณในข้อมูลของคุณเอง ติดต่อมาตามช่องทางท้ายนโยบายนี้ แล้วเราจะตอบภายใน 30 วัน"
        items:
          - "สิทธิได้รับแจ้งและขอเข้าถึงข้อมูลที่เรามีเกี่ยวกับคุณ"
          - "สิทธิขอรับสำเนาข้อมูล และขอให้ส่งต่อไปยังผู้อื่น"
          - "สิทธิขอแก้ไขข้อมูลที่ไม่ถูกต้องหรือไม่ครบถ้วน"
          - "สิทธิขอให้ลบข้อมูล หรือทำให้ไม่สามารถระบุตัวคุณได้"
          - "สิทธิขอให้ระงับการใช้ข้อมูลระหว่างที่ยังมีข้อโต้แย้ง"
          - "สิทธิคัดค้านการใช้ข้อมูลในเรื่องใดเรื่องหนึ่ง"
          - "สิทธิถอนความยินยอมที่เคยให้ไว้"
      complaints:
        title: "หากคุณไม่พอใจ"
        body:
          - "แจ้งเราก่อนแล้วเราจะพยายามแก้ไขให้ นอกจากนี้คุณมีสิทธิร้องเรียนต่อสำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคล (สคส.) ได้โดยไม่ต้องขออนุญาตเรา"
      children:
        title: "นักศึกษาที่อายุต่ำกว่า 20 ปี"
        body:
          - "เว็บไซต์นี้มีไว้สำหรับนักศึกษา UTCC ที่กำลังศึกษาอยู่ ซึ่งโดยทั่วไปบรรลุนิติภาวะแล้ว หากคุณอายุต่ำกว่า 20 ปี กฎหมายไทยอาจกำหนดให้ผู้ปกครองให้ความยินยอมแทน กรุณาปรึกษาผู้ปกครองก่อนสร้างบัญชี"
      changes:
        title: "การแก้ไขนโยบายนี้"
        body:
          - "หากเราเปลี่ยนแปลงว่าจะเก็บอะไรหรือเก็บไปทำอะไร เราจะปรับปรุงหน้านี้และแก้วันที่ด้านบน ในกรณีที่การเปลี่ยนแปลงต้องขอความยินยอมจากคุณ เราจะถามคุณ ไม่ถือเอาเองว่าคุณยินยอม"
      contact:
        title: "ติดต่อเรา"
        body:
          - "ติดต่อกลุ่มรุ่นพี่ UTCC ที่ดูแลเว็บไซต์นี้ เนื่องจากนี่เป็นโปรเจกต์ของนักศึกษา ไม่ใช่บริษัท ช่องทางที่เร็วที่สุดมักเป็นผู้ที่ส่งลิงก์นี้ให้คุณ หรือช่องทางติดต่อที่ประกาศไว้พร้อมกับลิงก์"
          - "ต้องกรอกช่องทางติดต่อก่อนเผยแพร่นโยบายนี้ — PDPA กำหนดให้ผู้ควบคุมข้อมูลต้องมีช่องทางติดต่อที่ใช้งานได้จริง"

  terms:
    title: "ข้อกำหนดการใช้งาน"
    intro: "กติกาการใช้เว็บไซต์นี้ สรุปสั้น ๆ คือ นี่เป็นเครื่องมือช่วยเรียนที่นักศึกษาทำขึ้น ใช้อย่างซื่อสัตย์ และอย่าเข้าใจผิดว่าเป็นระบบของมหาวิทยาลัย"
    updated_on: "26 กรกฎาคม 2569"
    sections:
      who:
        title: "ใครเป็นผู้ดูแลเว็บไซต์นี้"
        body:
          - "นี่เป็นเครื่องมือช่วยเรียนที่รุ่นพี่ UTCC จัดทำและดูแล เพื่อรุ่นน้องที่เรียนในหลักสูตร AI Fundamental ไม่ใช่เว็บไซต์ทางการของมหาวิทยาลัยหอการค้าไทย และไม่มีสิ่งใดในเว็บไซต์นี้เป็นบันทึกหรือการสื่อสารอย่างเป็นทางการของมหาวิทยาลัย"
      eligibility:
        title: "ใครใช้งานได้"
        body:
          - "บัญชีมีไว้สำหรับนักศึกษา UTCC ที่กำลังศึกษาอยู่ และอาจารย์หรือเจ้าหน้าที่ที่ทำงานร่วมกับนักศึกษา หนึ่งคนหนึ่งบัญชี และต้องลงทะเบียนด้วยรหัสนักศึกษาของตนเอง"
      account:
        title: "บัญชีของคุณ"
        body:
          - "เก็บรหัสผ่านไว้กับตัว และไม่ให้ผู้อื่นใช้บัญชีของคุณ หากสงสัยว่ามีคนอื่นเข้าถึงบัญชีของคุณได้ กรุณาแจ้งเรา"
          - "ห้ามสร้างบัญชีด้วยรหัสนักศึกษาของผู้อื่น และห้ามพยายามให้ได้มาซึ่งสิทธิ์อาจารย์หรือผู้ดูแลระบบที่ไม่ได้มอบให้คุณ"
      acceptable_use:
        title: "การใช้งานที่ยอมรับได้"
        body:
          - "ใช้เว็บไซต์นี้เป็นที่เรียนรู้ สิ่งต่อไปนี้ไม่อนุญาต"
        items:
          - "การโจมตีระบบ หรือพยายามเข้าถึงข้อมูลที่ไม่ใช่ของคุณ"
          - "การดึงข้อมูลด้วยโปรแกรมอัตโนมัติ หรือส่งคำขอถี่จนกระทบระบบ"
          - "การนำข้อมูลส่วนบุคคลของผู้อื่นขึ้นระบบ หรือเนื้อหาที่ผิดกฎหมายหรือคุกคามผู้อื่น"
          - "การส่งต่อบัญชีให้ผู้อื่น หรือใช้เว็บไซต์นี้ช่วยให้นักศึกษาคนอื่นแสดงผลงานที่ไม่ใช่ของตน"
      academic:
        title: "ความซื่อสัตย์ทางวิชาการ"
        body:
          - "เว็บไซต์นี้ไม่ให้หน่วยกิต ความก้าวหน้า ระดับ และอันดับบนกระดานผู้นำมีไว้ช่วยให้คุณเรียนรู้ และไม่มีความหมายต่อสำนักทะเบียน"
          - "แต่ละรายวิชากำหนดกติกาการใช้ AI ในงานที่ประเมินผลไว้เอง และกติกาเหล่านั้นมีผลเหนือสิ่งที่คุณอ่านที่นี่ เมื่อใช้ AI ทำงานส่งอาจารย์ ต้องอ้างอิงให้ชัดเจน การใช้เว็บไซต์นี้ไม่ใช่ข้อแก้ตัวหากถูกวินิจฉัยว่าประพฤติผิดทางวิชาการ"
      grading:
        title: "การตรวจแบบฝึกหัดทำงานอย่างไร และเชื่อถือได้เพียงใด"
        body:
          - "คุณควรรู้ว่าแบบฝึกหัดถูกตรวจอย่างไร เพราะมีผลต่อความหมายของผลลัพธ์ ปัจจุบันการตรวจบทเรียนทำงานในเบราว์เซอร์ของคุณ ซึ่งหมายความว่าเฉลยอยู่ในหน้าเว็บและผู้ที่ตั้งใจมองหาย่อมเห็นได้ และระบบบันทึกว่าผ่านเพราะเบราว์เซอร์ของคุณรายงานมาว่าผ่าน"
          - "ดังนั้นความก้าวหน้าที่นี่คือบันทึกสิ่งที่คุณแจ้งว่าทำจบ ไม่ใช่การวัดผลที่มีการคุมสอบ และไม่ควรนำไปอ้างในลักษณะนั้น เราเลือกบอกคุณตรง ๆ แทนที่จะปล่อยให้เข้าใจผิด การตรวจงานอย่างจริงจังต้องทำที่ฝั่งเซิร์ฟเวอร์ และจะย้ายไปที่นั่น"
      content:
        title: "เนื้อหารายวิชาและผลงานของคุณ"
        body:
          - "เนื้อหารายวิชาบนเว็บไซต์นี้เป็นของผู้จัดทำ คุณใช้เพื่อการศึกษาได้ แต่ห้ามเผยแพร่ซ้ำหรือนำไปขาย"
          - "สิ่งที่คุณเขียนลงในระบบยังเป็นของคุณ การนำมาไว้ที่นี่ถือเป็นการอนุญาตให้เราจัดเก็บและแสดงผลเท่าที่จำเป็นต่อการให้บริการ"
      availability:
        title: "ความพร้อมใช้งาน"
        body:
          - "เว็บไซต์นี้ดูแลโดยนักศึกษาในเวลาของตนเอง ไม่มีการรับประกันว่าระบบจะใช้งานได้ตลอด ไม่มีฝ่ายบริการลูกค้า และไม่มีคำมั่นว่าเว็บไซต์จะยังอยู่ในภาคการศึกษาหน้า ฟังก์ชันอาจเปลี่ยนหรือถูกถอดออก และเราอาจต้องล้างข้อมูลระหว่างที่ยังพัฒนาอยู่"
      liability:
        title: "ไม่มีการรับประกัน และขอบเขตความรับผิด"
        body:
          - "เว็บไซต์นี้ให้บริการตามสภาพที่เป็นอยู่ โดยไม่มีการรับประกันใด ๆ เนื้อหาเป็นเครื่องมือช่วยเรียนที่นักศึกษาเขียนขึ้น จึงอาจมีข้อผิดพลาดหรือล้าสมัย"
          - "เท่าที่กฎหมายไทยอนุญาต ผู้ดูแลเว็บไซต์นี้ไม่รับผิดต่อความเสียหายที่เกิดจากการใช้งานของคุณ รวมถึงงานที่สูญหาย ความก้าวหน้าที่สูญหาย หรือคะแนนที่คุณไม่ได้รับ ทั้งนี้ไม่มีข้อความใดจำกัดความรับผิดในส่วนที่กฎหมายไม่อนุญาตให้จำกัด"
      termination:
        title: "การระงับบัญชี"
        body:
          - "เราอาจระงับหรือลบบัญชีที่ฝ่าฝืนข้อกำหนดเหล่านี้ โดยเฉพาะกรณีที่ทำให้ข้อมูลของนักศึกษาคนอื่นหรือตัวระบบเสี่ยงต่อความเสียหาย คุณเลิกใช้งานและแจ้งให้เราลบบัญชีได้ทุกเมื่อ"
      changes:
        title: "การแก้ไขข้อกำหนดเหล่านี้"
        body:
          - "เราอาจปรับปรุงข้อกำหนดเหล่านี้เมื่อเว็บไซต์เติบโตขึ้น วันที่ด้านบนระบุครั้งล่าสุดที่แก้ไข หากคุณใช้งานต่อหลังการเปลี่ยนแปลง ถือว่าคุณยอมรับฉบับใหม่"
      contact:
        title: "ติดต่อเรา"
        body:
          - "ใช้ช่องทางเดียวกับนโยบายความเป็นส่วนตัว ดูช่องทางติดต่อที่ประกาศไว้พร้อมกับลิงก์ที่นำคุณมาที่นี่"
          - "ต้องกรอกช่องทางติดต่อก่อนเผยแพร่ข้อกำหนดเหล่านี้"

  errors:
    messages:

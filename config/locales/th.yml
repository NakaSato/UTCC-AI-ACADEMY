      p2: "ในทางปฏิบัติ เราต้องแยกข้อมูลเป็นชุดฝึก (train set) และชุดทดสอบ (test set) เสมอ เพื่อวัดว่าโมเดล generalize ได้จริง ไม่ใช่แค่จำคำตอบ"
      sup_title: "Supervised Learning"
      sup_desc: "ข้อมูลมีเฉลยกำกับ โมเดลเรียนจากคู่ (input → output) แล้วทำนายค่าที่ยังไม่เคยเห็น"
      sup_eg: "เช่น ทำนายยอดขาย, คัดกรองอีเมลสแปม"
      unsup_title: "Unsupervised Learning"
      unsup_desc: "ข้อมูลไม่มีเฉลย โมเดลหาโครงสร้างหรือกลุ่มที่ซ่อนอยู่ในข้อมูลเอง"
      unsup_eg: "เช่น จัดกลุ่มลูกค้า, ลดมิติข้อมูล"
      code_comment: "# 80% ฝึก / 20% ทดสอบ"
      to_quiz: "ทำแบบฝึกหัด →"
      open_link: "เปิดลิงก์ →"
      blocks:
        - "จำไว้ว่า: ชุดทดสอบต้องไม่ถูกใช้ระหว่างฝึกโมเดล ไม่เช่นนั้นผลที่ได้จะดูดีเกินจริง"
        - "n_{train} = \\lceil 0.8\\,N \\rceil, \\quad n_{test} = N - n_{train}"
        - "scores = cross_val_score(model, X, y, cv=5)\nprint(scores.mean(), scores.std())"
        - "เอกสาร scikit-learn · train_test_split"
    quiz:
      eyebrow: "แบบฝึกหัด · เลือกคำตอบที่ถูก"
      question: "ร้านค้าออนไลน์มีข้อมูลพฤติกรรมลูกค้า 50,000 ราย แต่ไม่มีการระบุกลุ่มไว้ล่วงหน้า และต้องการแบ่งลูกค้าเป็นกลุ่มเพื่อทำการตลาด งานนี้จัดเป็นปัญหาแบบใด?"
      keys: [ "ก", "ข", "ค", "ง" ]
      check: "ตรวจคำตอบ"
      to_code: "ไปโจทย์เขียนโค้ด →"
      correct_title: "ถูกต้อง +5 เพชร"
      correct_body: "ถูกต้อง — ไม่มี label กำกับล่วงหน้า จึงเป็น clustering เช่น K-Means หรือ hierarchical clustering"
      wrong_title: "ลองอีกครั้ง −1 หัวใจ"
      wrong_body: "ยังไม่ถูก — ข้อมูลชุดนี้ไม่มีเฉลยกำกับ จึงไม่ใช่ supervised learning ลองพิจารณาว่าโมเดลต้องหากลุ่มด้วยตัวเอง"
    code:

              - "ทำงานกับข้อมูลแบบตาราง"
          - title: "เตรียมชุดข้อมูล"
            desc: "เปลี่ยนชุดข้อมูลดิบให้เป็นข้อมูลเข้าที่ชัดเจนและตรวจสอบได้สำหรับงาน AI"
            topics:

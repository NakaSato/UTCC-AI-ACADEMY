    modules:
      - title: "ข้อมูลและการคิดแบบ AI"
        desc: "ข้อมูลในระบบ AI มาจากไหน อะไรทำให้ข้อมูลใช้งานได้ และคำถามที่ต้องถามก่อนเริ่มฝึกโมเดล"
        topics:
          - "AI คืออะไร ทำอะไรได้จริง"
          - "ประเภทของข้อมูล"
          - "วัดคุณภาพข้อมูล"
      - title: "Machine Learning พื้นฐาน"
        desc: "คำศัพท์ที่บทเรียนถัดไปจะใช้ตลอด — โมเดลเรียนรู้จากตัวอย่างอย่างไร และดูอย่างไรว่าโมเดลไหนดีหรือไม่ดี"
        topics:
          - "โมเดลเรียนรู้ได้อย่างไร"
          - "Loss และการวัดผล"
          - "Supervised vs. Unsupervised"
          - "Overfitting และ regularization"
      - title: "สร้างโมเดลแรกด้วย scikit-learn"
        desc: "ลงมือทำครบทุกขั้น ตั้งแต่โหลดชุดข้อมูล แบ่งข้อมูล ฝึกโมเดล ไปจนถึงอ่านค่าคะแนนที่ได้"
        topics:
          - "เตรียมข้อมูลด้วย pandas"
          - "Train, evaluate, tune"
      - title: "AI เชิงสร้าง (Generative AI)"
        desc: "โมเดลภาษากำลังทำอะไรตอนที่มันตอบ และจะใช้มันให้ได้ผลลัพธ์ที่เชื่อถือได้อย่างไร"
        topics:
          - "LLM ทำงานอย่างไร"
          - "เขียน prompt ให้ได้ผล"
      - title: "นำ AI ไปใช้ในธุรกิจ"
        desc: "เลือกปัญหาที่ควรทำให้เป็นอัตโนมัติ ประเมินผลตอบแทน และดูตัวอย่างเคสธุรกิจไทยของจริง"
        topics:
          - "ประเมินความคุ้มค่า"
          - "กรณีศึกษาธุรกิจไทย"
      - title: "จรรยาบรรณและ PDPA"
        desc: "AI สร้างความเสียหายกับคนได้ตรงไหน และ PDPA กำหนดหน้าที่อะไรไว้กับผู้ดูแลข้อมูลส่วนบุคคลของคนไทย"
        topics:
          - "อคติในข้อมูล"
          - "ความเป็นส่วนตัวของข้อมูล"


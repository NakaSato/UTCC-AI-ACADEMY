      AI1102:
        title: "Python สำหรับงาน AI"
        desc: "เขียน Python ให้พร้อมทำงานกับข้อมูลจริง ตั้งแต่โครงสร้างข้อมูล pandas ไปจนถึงการเตรียม dataset"
        instructor: "อ. ธนกฤต"
      AI2201:
        title: "Machine Learning เบื้องต้น"
        desc: "ฝึกและประเมินโมเดล regression, classification และ clustering ด้วย scikit-learn บนข้อมูลธุรกิจไทย"
        instructor: "ผศ.ดร. ชนกานต์"

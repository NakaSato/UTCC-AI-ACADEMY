          p2: "เลือกวิธีเรียนรู้จากข้อมูลและการตัดสินใจ: ถ้ามีคำตอบที่เชื่อถือได้ ให้เรียนรู้เพื่อพยากรณ์คำตอบนั้น ถ้าไม่มี ให้บรรยายหรือจัดกลุ่มสิ่งที่มีโดยไม่สร้าง label ขึ้นเอง"

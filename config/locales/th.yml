        title: "Prompt Engineering สำหรับธุรกิจ"
        desc: "ออกแบบ prompt ที่ใช้ได้จริงในงานการตลาด บริการลูกค้า และการวิเคราะห์เอกสาร พร้อมวัดผลอย่างเป็นระบบ"
        instructor: "อ. พิมพ์ชนก"
      AI2108:
        title: "Data & Visualization"
        desc: "เล่าเรื่องจากข้อมูลด้วยกราฟที่ถูกต้อง เลือกชนิดแผนภูมิ จัดการข้อมูลสกปรก และทำ dashboard"
        instructor: "อ. ธนกฤต"
      AI3301:
        title: "Neural Networks เบื้องต้น"
        desc: "จาก perceptron ถึง CNN เข้าใจ backpropagation และฝึกโมเดลจริงด้วย PyTorch"
        instructor: "รศ.ดร. อาทิตย์"
      AI2210:
        title: "Generative AI สำหรับการตลาด"
        desc: "ใช้โมเดลสร้างภาพและข้อความในงานแคมเปญ พร้อมข้อควรระวังเรื่องลิขสิทธิ์และแบรนด์"
        instructor: "อ. พิมพ์ชนก"
      AI2402:

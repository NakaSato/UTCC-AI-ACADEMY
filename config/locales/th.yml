      AI1101:
        title: "พื้นฐานปัญญาประดิษฐ์"
        desc: "เข้าใจว่า AI ทำงานอย่างไร ตั้งแต่ข้อมูล การเรียนรู้ของเครื่อง ไปจนถึงการนำโมเดลไปใช้จริงในงานธุรกิจ"
        instructor: "ผศ.ดร. ชนกานต์"
      AI1102:
        title: "Python สำหรับงาน AI"
        desc: "เขียน Python ให้พร้อมทำงานกับข้อมูลจริง ตั้งแต่โครงสร้างข้อมูล pandas ไปจนถึงการเตรียม dataset"
        instructor: "อ. ธนกฤต"
      AI2201:
        title: "Machine Learning เบื้องต้น"
        desc: "ฝึกและประเมินโมเดล regression, classification และ clustering ด้วย scikit-learn บนข้อมูลธุรกิจไทย"
        instructor: "ผศ.ดร. ชนกานต์"
      AI2105:
        title: "Prompt Engineering สำหรับธุรกิจ"
        desc: "ออกแบบ prompt ที่ใช้ได้จริงในงานการตลาด บริการลูกค้า และการวิเคราะห์เอกสาร พร้อมวัดผลอย่างเป็นระบบ"
        instructor: "อ. พิมพ์ชนก"
      AI2108:
        title: "Data & Visualization"
        desc: "เล่าเรื่องจากข้อมูลด้วยกราฟที่ถูกต้อง เลือกชนิดแผนภูมิ จัดการข้อมูลสกปรก และทำ dashboard"
        instructor: "อ. ธนกฤต"
      AI3301:
        title: "Neural Networks เบื้องต้น"
        desc: "จาก perceptron ถึง CNN เข้าใจ backpropagation และฝึกโมเดลจริงด้วย PyTorch"
        instructor: "รศ.ดร. อาทิตย์"
      AI2210:
        title: "Generative AI สำหรับการตลาด"
        desc: "ใช้โมเดลสร้างภาพและข้อความในงานแคมเปญ พร้อมข้อควรระวังเรื่องลิขสิทธิ์และแบรนด์"
        instructor: "อ. พิมพ์ชนก"
      AI2402:
        title: "จรรยาบรรณและธรรมาภิบาล AI"
        desc: "อคติในข้อมูล ความเป็นส่วนตัว PDPA และการกำกับดูแลการใช้ AI ในองค์กร"
        instructor: "ผศ. วรรณิดา"


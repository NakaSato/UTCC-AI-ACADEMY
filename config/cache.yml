default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# No `database:` key: solid_cache_entries lives in the primary database and
# shares its pool. See config/database.yml for the connection budget behind that.
production:
  <<: *default

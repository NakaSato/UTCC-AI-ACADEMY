# Render blueprint — the approved production target.
#
# Render pulls the prebuilt image from GHCR. CI publishes a Git-SHA tag, signs
# the resulting digest, and the manual production workflow deploys that digest
# through the Render deploy hook. The "release" tag below is only the service's
# bootstrap/default reference; it is never the release identity or rollback
# target. A production deploy must use the digest workflow.
#
# The Render service runtime is immutable. If an existing dashboard service was
# created with runtime: docker, create the image-backed service separately,
# verify it, move the custom domain, and retire the old service only through the
# approved release procedure.

services:
  - type: web
    name: utcc-ai-academy
    runtime: image

    image:
      url: ghcr.io/nakasato/utcc-ai-academy:release
      creds:
        fromRegistryCreds:
          name: utcc-ai-academy-ghcr

    region: singapore
    numInstances: 1
    plan: starter

    # Production currently uses Rails local Active Storage. The disk is part
    # of the authoritative recovery boundary in ADR-0021.
    disk:
      name: utcc-ai-academy-storage
      mountPath: /rails/storage
      sizeGB: 10

    # Render reaches this endpoint before routing traffic to the service.
    healthCheckPath: /up

    # Expand/migrate/contract releases run the migration before new traffic.
    # This is safe only for backward-compatible migrations.
    preDeployCommand: bin/rails db:migrate

    # Render issues the certificate and terminates TLS here. The domain must
    # match config.hosts in production.rb.
    domains:
      - academy.boring9.dev

    envVars:
      - key: RAILS_MASTER_KEY
        sync: false

      - key: HTTP_PORT
        value: 10000

      - key: PORT
        value: 10000

      # Run Solid Queue inside Puma until a worker split is approved.
      - key: SOLID_QUEUE_IN_PUMA
        value: true

      # External managed Postgres. The dashboard owns the complete URL and
      # recovery provider; no database credential is committed here.
      - key: DATABASE_URL
        sync: false
